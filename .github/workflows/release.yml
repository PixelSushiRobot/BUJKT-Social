# Builds bujkt-social.zip and attaches it to a GitHub release whenever a
# version tag (v1.0.0, v1.1.0, …) is pushed. The tag must match the version
# in manifest.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest.json version $version"
            exit 1
          fi

      - name: Build the zip
        run: |
          mkdir bujkt-social
          cp manifest.json *.js *.css bujkt-social/
          if [ -d icons ]; then cp -r icons bujkt-social/; fi
          zip -r bujkt-social.zip bujkt-social

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: bujkt-social.zip
          generate_release_notes: true
